name: Build and Test (cups-filters integration)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  printing:
    name: ${{ matrix.arch.name }} / ${{ matrix.cups }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            runner: ubuntu-latest
            emulated: false
          - name: arm64
            runner: ubuntu-24.04-arm
            emulated: false
          - name: armv7
            runner: ubuntu-latest
            platform: linux/arm/v7
            emulated: true
          - name: riscv64
            runner: ubuntu-latest
            platform: linux/riscv64
            emulated: true
        cups: [system-2x, source-2.5.x, source-3.x]
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 360
    env:
      CC: /usr/bin/gcc
      RUSTUP_TOOLCHAIN: 1.85.1
      CUPS_KIND: ${{ matrix.cups }}
      CI_COMMAND_TIMEOUT: ${{ matrix.arch.emulated && '180m' || '30m' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        if: ${{ !matrix.arch.emulated }}
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy

      - name: Build and test natively
        if: ${{ !matrix.arch.emulated }}
        run: |
          cd ci/rust
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
          cd ../..
          ci/rust/target/debug/libcupsfilters-ci all

      - name: Set up QEMU
        if: ${{ matrix.arch.emulated }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,riscv64

      - name: Build and test under QEMU
        if: ${{ matrix.arch.emulated }}
        env:
          CI_PLATFORM: ${{ matrix.arch.platform }}
        run: |
          docker run --rm --platform "$CI_PLATFORM" \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env CC --env CUPS_KIND --env CI_COMMAND_TIMEOUT \
            --env DEBIAN_FRONTEND=noninteractive \
            debian:trixie \
            bash -euc '
              apt-get update
              apt-get install -y ca-certificates cargo rustc rustfmt rust-clippy
              cd ci/rust
              cargo fmt --check
              cargo test --locked
              cargo clippy --locked --all-targets -- -D warnings
              cargo build --locked
              cd ../..
              ci/rust/target/debug/libcupsfilters-ci all
            '

      - name: Upload outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libcupsfilters-printing-${{ matrix.arch.name }}-${{ matrix.cups }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ci-results/
            config.log
            test-suite.log
            cupsfilters/*.log
            .ci-work/cups/config.log
            .ci-work/libppd/config.log
            .ci-work/cups-filters/config.log
          include-hidden-files: true
