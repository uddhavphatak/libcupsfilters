name: Build and Test (cups-filters integration)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  printing:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: /usr/bin/gcc
      RUSTUP_TOOLCHAIN: 1.85.1
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy

      - name: Validate and build Rust CI runner
        working-directory: ci/rust
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked

      - name: Install build dependencies
        run: ci/rust/target/debug/libcupsfilters-ci deps

      - name: Build pinned PDFio
        run: ci/rust/target/debug/libcupsfilters-ci pdfio

      - name: Build and stage this libcupsfilters checkout
        id: library
        run: ci/rust/target/debug/libcupsfilters-ci library

      - name: Build pinned libppd and cups-filters
        run: ci/rust/target/debug/libcupsfilters-ci consumers

      - name: Run cups-filters pdftopdf smoke test
        run: ci/rust/target/debug/libcupsfilters-ci filter

      - name: Run existing regression tests
        if: ${{ !cancelled() && steps.library.outcome == 'success' }}
        run: ci/rust/target/debug/libcupsfilters-ci check

      - name: Run staged consumer tests
        if: ${{ !cancelled() && steps.library.outcome == 'success' }}
        run: ci/rust/target/debug/libcupsfilters-ci autopkgtest

      - name: Upload outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libcupsfilters-printing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ci-results/
            config.log
            test-suite.log
            cupsfilters/*.log
            .ci-work/libppd/config.log
            .ci-work/cups-filters/config.log
          include-hidden-files: true
